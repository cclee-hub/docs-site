<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57534e"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica","Arial","Noto Sans","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #1c1917; }
    .mono { font-family: "SFMono-Regular","Menlo","Consolas","Courier New",monospace; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 22px; fill: #57534e; }
    .card-title { font-size: 24px; font-weight: 700; }
    .card-body { font-size: 22px; }
    .card-sub { font-size: 21px; fill: #57534e; }
    .caption { font-size: 22px; fill: #1c1917; }
    .caption-muted { font-size: 22px; fill: #57534e; }
  </style>

  <rect width="1200" height="620" fill="#ffffff"/>

  <text x="60" y="72" class="title">ALTER DEFAULT PRIVILEGES 的生效范围</text>
  <text x="60" y="110" class="subtitle">一个角色 × 一个库，规则不跨库</text>

  <!-- 终端卡片 -->
  <rect x="60" y="150" width="500" height="230" rx="12" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5"/>
  <circle cx="88" cy="180" r="7" fill="#e7e5e4"/>
  <circle cx="112" cy="180" r="7" fill="#e7e5e4"/>
  <circle cx="136" cy="180" r="7" fill="#e7e5e4"/>
  <text x="84" y="226" class="mono" font-size="21">$ psql -d postgres</text>
  <text x="84" y="262" class="mono" font-size="21">ALTER DEFAULT PRIVILEGES</text>
  <text x="84" y="298" class="mono" font-size="21">  FOR ROLE app_owner</text>
  <text x="84" y="334" class="mono" font-size="21">  GRANT ... TO app_role;</text>

  <line x1="566" y1="265" x2="628" y2="265" stroke="#57534e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- postgres 库卡片 -->
  <rect x="640" y="150" width="500" height="108" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="664" y="192" class="card-title">postgres 库</text>
  <text x="664" y="232" class="card-body" fill="#166534">之后新建的表：自动带授权 ✓</text>

  <!-- 业务库卡片 -->
  <rect x="640" y="282" width="500" height="108" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="664" y="324" class="card-title">业务库 appdb</text>
  <text x="664" y="364" class="card-body" fill="#991b1b">之后新建的表：无授权 → 查询报 42501 ✗</text>

  <!-- 规则存放标注 -->
  <text x="60" y="470" class="caption">规则存在库本地的 pg_default_acl 目录里——换一个库，就要再执行一遍</text>
  <text x="60" y="510" class="caption-muted">FOR ROLE 缺省是「当前执行的角色」；只管之后新建的对象，存量表要手工 GRANT</text>
  <text x="60" y="550" class="caption-muted">删角色报依赖时，回 DETAIL 点名的库执行 DROP OWNED BY 清掉残留条目</text>
</svg>
