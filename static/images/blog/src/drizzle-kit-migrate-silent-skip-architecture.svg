<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57534e"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica","Arial","Noto Sans","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #1c1917; }
    .mono { font-family: "SFMono-Regular","Menlo","Consolas","Courier New",monospace; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 22px; fill: #57534e; }
    .box-title { font-size: 24px; font-weight: 700; }
    .box-sub { font-size: 21px; fill: #57534e; }
    .arrow-label { font-size: 21px; fill: #57534e; }
    .caption { font-size: 22px; fill: #1c1917; }
    .ghost-title { font-size: 22px; font-weight: 700; fill: #57534e; }
    .ghost-body { font-size: 21px; fill: #78716c; }
  </style>

  <rect width="1200" height="680" fill="#ffffff"/>

  <text x="60" y="66" class="title">部署迁移的 owner 通道</text>
  <text x="60" y="104" class="subtitle">逐文件直灌、服务器端记账、收尾双核对——任何一步失败就停</text>

  <!-- 流程行 -->
  <rect x="60" y="170" width="220" height="120" rx="12" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="82" y="216" class="box-title">迁移 SQL 文件</text>
  <text x="82" y="254" class="box-sub">按序号逐个处理</text>

  <line x1="280" y1="230" x2="330" y2="230" stroke="#57534e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="336" y="170" width="240" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="358" y="216" class="box-title">应用 SQL</text>
  <text x="358" y="254" class="box-sub" fill="#1d4ed8">失败即停，不留半途</text>

  <line x1="576" y1="230" x2="626" y2="230" stroke="#57534e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="632" y="170" width="220" height="120" rx="12" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="654" y="210" class="box-title">sha256 记账</text>
  <text x="654" y="244" class="box-sub">hash 写入 journal</text>
  <text x="654" y="272" class="box-sub">服务器端计算</text>

  <line x1="852" y1="230" x2="902" y2="230" stroke="#57534e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="908" y="150" width="232" height="160" rx="12" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
  <text x="930" y="192" class="box-title">双核对</text>
  <text x="930" y="230" class="box-sub">journal 条数 = 文件数</text>
  <text x="930" y="262" class="box-sub">关键表真实存在</text>
  <text x="930" y="294" class="box-sub">属主核对返回 0 行</text>

  <!-- 分支 -->
  <path d="M 990 310 L 990 360 L 760 360 L 760 400" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="600" y="404" width="320" height="76" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="624" y="450" class="box-title" fill="#166534">核对通过 → 继续部署</text>

  <path d="M 1058 310 L 1058 360 L 1010 360 L 1010 400" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="940" y="404" width="200" height="76" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="962" y="436" class="box-title" fill="#991b1b" font-size="22">不一致 → 终止</text>
  <text x="962" y="466" class="box-sub" fill="#991b1b">报缺失清单</text>

  <!-- 退役说明 -->
  <rect x="60" y="404" width="480" height="180" rx="12" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="84" y="446" class="ghost-title">已退役：部署路径跑 drizzle-kit migrate</text>
  <text x="84" y="486" class="ghost-body">退出 0 ≠ 已应用：journal 与表结构可能脱节</text>
  <text x="84" y="518" class="ghost-body">账本被污染后，后续迁移永远被静默跳过</text>
  <text x="84" y="550" class="ghost-body">本地开发仍可用（db:migrate），部署不再依赖</text>

  <text x="60" y="636" class="caption">迁移永远用 owner 角色跑——属主错位（超级用户建的表）会让 policy 应用整段卡死</text>
</svg>
