<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57534e"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica","Arial","Noto Sans","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #1c1917; }
    .mono { font-family: "SFMono-Regular","Menlo","Consolas","Courier New",monospace; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 22px; fill: #57534e; }
    .box-title { font-size: 24px; font-weight: 700; }
    .box-sub { font-size: 21px; fill: #57534e; }
    .caption { font-size: 22px; fill: #1c1917; }
    .ghost-title { font-size: 22px; font-weight: 700; fill: #57534e; }
    .ghost-body { font-size: 21px; fill: #78716c; }
  </style>

  <rect width="1200" height="680" fill="#ffffff"/>

  <text x="60" y="66" class="title">Deploy-time migration: the owner pipeline</text>
  <text x="60" y="104" class="subtitle">apply file by file, journal server-side, verify at the end — stop on any failure</text>

  <!-- flow row -->
  <rect x="60" y="170" width="220" height="120" rx="12" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="82" y="216" class="box-title">Migration files</text>
  <text x="82" y="254" class="box-sub">applied in order</text>

  <line x1="280" y1="230" x2="330" y2="230" stroke="#57534e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="336" y="170" width="220" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="358" y="216" class="box-title">Apply SQL</text>
  <text x="358" y="254" class="box-sub" fill="#1d4ed8">fail fast</text>

  <line x1="556" y1="230" x2="600" y2="230" stroke="#57534e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="606" y="170" width="212" height="120" rx="12" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="628" y="210" class="box-title">sha256 journal</text>
  <text x="628" y="244" class="box-sub">hash recorded</text>
  <text x="628" y="272" class="box-sub">into the ledger</text>

  <line x1="818" y1="230" x2="856" y2="230" stroke="#57534e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="862" y="150" width="278" height="160" rx="12" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
  <text x="884" y="192" class="box-title">Verify</text>
  <text x="884" y="230" class="box-sub">journal = file count</text>
  <text x="884" y="262" class="box-sub">tables really exist</text>
  <text x="884" y="294" class="box-sub">owner check: 0 rows</text>

  <!-- branches -->
  <path d="M 952 310 L 952 360 L 690 360 L 690 400" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="560" y="404" width="260" height="76" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="584" y="450" class="box-title" fill="#166534" font-size="22">verified → deploy</text>

  <path d="M 1090 310 L 1090 360 L 990 360 L 990 400" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="840" y="404" width="300" height="76" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="864" y="436" class="box-title" fill="#991b1b" font-size="21">mismatch → stop</text>
  <text x="864" y="466" class="box-sub" fill="#991b1b">report missing</text>

  <!-- retired path -->
  <rect x="60" y="404" width="480" height="180" rx="12" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="84" y="446" class="ghost-title">Retired: drizzle-kit migrate in deploys</text>
  <text x="84" y="486" class="ghost-body">exit 0 ≠ applied: journal and schema can diverge</text>
  <text x="84" y="518" class="ghost-body">a polluted ledger makes later migrations skip silently</text>
  <text x="84" y="550" class="ghost-body">still fine for local dev (db:migrate), just not deploys</text>

  <text x="60" y="636" class="caption">Always run migrations as the owner role — tables owned by a superuser stall policy application.</text>
</svg>
